<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#ffeaf5">
<title>もちもちメンダコ - ぷにぷに深海ルーム</title>
<style>
:root{--ink:#754761;--pink:#f6a5cd;--deep:#302e67}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;color:var(--ink);background:radial-gradient(ellipse at 50% 28%,#b6e6fa 0%,#8acbe9 40%,#6867a8 100%);touch-action:manipulation;user-select:none}
.app{height:100dvh;max-width:560px;margin:auto;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom);position:relative;overflow:hidden}
.top{display:flex;align-items:center;justify-content:space-between;padding:12px 2px 5px;z-index:2}
.brand{font-size:20px;font-weight:900;color:#fff;text-shadow:0 2px 7px #3f4a89aa;letter-spacing:.03em}
.sound{border:1px solid #ffffff90;background:#ffffff35;color:#fff;border-radius:50%;width:42px;height:42px;font-size:19px}
.stats{display:flex;justify-content:center;gap:8px;z-index:2;flex-wrap:wrap}
.stat{background:#ffffffd9;border:1px solid #ffffffa8;border-radius:999px;padding:7px 13px;font-size:13px;font-weight:800;box-shadow:0 4px 12px #30305a20}
.scene{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.seafloor{position:absolute;bottom:-65px;left:-15%;width:130%;height:140px;border-radius:50% 50% 0 0;background:linear-gradient(#b8a3e8,#8675c4);opacity:.8}
.plant{position:absolute;bottom:45px;width:13px;height:90px;border-radius:100% 0;background:#83d9ce;transform-origin:bottom;opacity:.75;animation:sway 3s ease-in-out infinite}
.p1{left:9%;transform:rotate(-13deg)}.p2{right:11%;height:120px;animation-delay:-1.2s;transform:rotate(10deg)}
.bubble{position:absolute;bottom:-35px;border:2px solid #ffffff9a;background:#ffffff22;border-radius:50%;animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-110vh);opacity:0}}
@keyframes sway{50%{rotate:8deg}}
.octo-wrap{position:relative;width:min(80vw,350px);aspect-ratio:1;z-index:1;display:flex;align-items:center;justify-content:center;touch-action:none}
.octo{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 20px 12px #33336b38);transition:transform .16s ease;touch-action:none}
.octo.squish{animation:squish .42s cubic-bezier(.2,.8,.25,1)}
.octo.stretch{animation:stretch .45s ease}
.octo.pat{animation:pat .36s ease}
@keyframes squish{0%{transform:scale(1)}28%{transform:scale(1.15,.76)}57%{transform:scale(.94,1.08)}78%{transform:scale(1.03,.98)}100%{transform:scale(1)}}
@keyframes stretch{0%,100%{transform:scale(1)}40%{transform:scale(.78,1.18)}75%{transform:scale(1.08,.94)}}
@keyframes pat{0%,100%{transform:rotate(0) scale(1)}35%{transform:rotate(-5deg) scale(1.04)}70%{transform:rotate(4deg) scale(.98)}}
.face{transition:opacity .12s ease}
.reaction{min-height:32px;text-align:center;font-size:19px;font-weight:900;color:#fff;text-shadow:0 2px 6px #44417c88;z-index:2;margin:0 0 8px}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;z-index:3;padding-bottom:9px}
.action{border:1px solid #ffffffa6;background:#ffffffd9;border-radius:18px;padding:11px 4px 10px;color:#84516f;font-weight:800;box-shadow:0 5px 0 #5b589733;font-size:14px;min-height:66px}
.action span{display:block;font-size:22px;margin-bottom:2px}
.action.active{background:#ffcae4;transform:translateY(2px);box-shadow:0 3px 0 #5b589733}
.bottom{display:flex;justify-content:center;padding:2px 0 12px;z-index:2}
.reset{background:#4d4a86a8;border:1px solid #ffffff70;color:white;border-radius:999px;padding:8px 17px;font-weight:700}
.float-text{position:absolute;pointer-events:none;font-weight:900;font-size:25px;color:#fff;text-shadow:0 2px 7px #64518c;animation:floatup .8s ease-out forwards;z-index:5}
@keyframes floatup{0%{opacity:0;transform:translate(-50%,10px) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-55px) scale(1.25)}}
.toast{position:absolute;top:72px;left:50%;transform:translateX(-50%);background:#ffffffdf;border-radius:999px;padding:7px 13px;font-size:12px;font-weight:700;white-space:nowrap;opacity:0;transition:opacity .2s;z-index:8}
.toast.show{opacity:1}
@media(min-width:500px){.app{border-left:1px solid #ffffff30;border-right:1px solid #ffffff30}.brand{font-size:22px}}
</style>
</head>
<body>
<main class="app">
  <header class="top"><div class="brand">🫧 もちもちメンダコ</div><button class="sound" id="sound" aria-label="音のオンオフ">♪</button></header>
  <div class="stats"><div class="stat">ぷに回数 <b id="count">0</b></div><div class="stat">ごきげん <b id="mood">ふつう</b></div><div class="stat">なかよし度 <b id="love">♡ 0</b></div></div>
  <div class="toast" id="toast">そっとタッチしてみてね</div>
  <section class="scene" id="scene" aria-label="メンダコのいる深海">
    <i class="bubble" style="left:12%;width:14px;height:14px;animation-duration:9s"></i><i class="bubble" style="left:26%;width:8px;height:8px;animation-duration:12s;animation-delay:-5s"></i><i class="bubble" style="left:79%;width:19px;height:19px;animation-duration:10s;animation-delay:-2s"></i><i class="bubble" style="left:89%;width:9px;height:9px;animation-duration:13s;animation-delay:-8s"></i>
    <div class="plant p1"></div><div class="plant p2"></div><div class="seafloor"></div>
    <div class="octo-wrap" id="octoWrap" aria-label="メンダコを触る">
      <svg class="octo" id="octo" viewBox="0 0 320 320" role="img" aria-label="もちもち3D風のピンクのメンダコ">
       <defs>
        <radialGradient id="bodyG" cx="31%" cy="19%" r="83%"><stop offset="0" stop-color="#fff0fa"/><stop offset=".28" stop-color="#ffc9e5"/><stop offset=".68" stop-color="#f68fc4"/><stop offset="1" stop-color="#d967a6"/></radialGradient>
        <radialGradient id="armG" cx="30%" cy="15%" r="95%"><stop offset="0" stop-color="#ffd9ed"/><stop offset=".5" stop-color="#f69aca"/><stop offset="1" stop-color="#d66ca9"/></radialGradient>
        <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
        <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
       </defs>
       <ellipse cx="160" cy="268" rx="90" ry="17" fill="#33366b" opacity=".14" filter="url(#soft)"/>
       <g fill="url(#armG)" stroke="#db73aa" stroke-width="2">
        <path d="M92 183 C70 204 77 236 99 238 C116 239 119 217 109 204 C130 232 151 228 153 209 L145 179Z"/>
        <path d="M122 194 C105 220 123 251 145 240 C160 232 150 213 151 205 C170 234 191 237 198 215 L181 184Z"/>
        <path d="M159 190 C148 216 166 247 187 232 C202 222 188 207 187 198 C207 221 228 214 230 194 L203 168Z"/>
        <path d="M192 177 C186 202 209 225 225 208 C236 197 222 185 218 174 L209 153Z"/>
       </g>
       <path d="M68 139 C65 92 99 52 151 49 C205 46 245 84 245 132 C245 170 219 196 181 200 C142 204 99 188 80 165 C72 156 69 148 68 139Z" fill="url(#bodyG)" stroke="#e67eb5" stroke-width="2.5"/>
       <ellipse cx="112" cy="86" rx="33" ry="16" fill="url(#shine)" opacity=".75" transform="rotate(-29 112 86)"/>
       <ellipse cx="93" cy="125" rx="9" ry="18" fill="#fff" opacity=".22" transform="rotate(-30 93 125)"/>
       <g id="happyFace" class="face">
        <ellipse cx="112" cy="143" rx="18" ry="10" fill="#f16da8" opacity=".52"/><ellipse cx="207" cy="143" rx="18" ry="10" fill="#f16da8" opacity=".52"/>
        <ellipse cx="132" cy="126" rx="9" ry="12" fill="#583b64"/><ellipse cx="188" cy="126" rx="9" ry="12" fill="#583b64"/>
        <ellipse cx="135" cy="122" rx="3.2" ry="4" fill="white"/><ellipse cx="191" cy="122" rx="3.2" ry="4" fill="white"/>
        <path d="M151 145 Q160 155 169 145" fill="none" stroke="#a84f7e" stroke-width="3.5" stroke-linecap="round"/>
       </g>
       <g id="shyFace" class="face" style="display:none">
        <ellipse cx="112" cy="143" rx="20" ry="12" fill="#ee5799" opacity=".7"/><ellipse cx="207" cy="143" rx="20" ry="12" fill="#ee5799" opacity=".7"/>
        <path d="M121 127 Q131 119 141 127 M179 127 Q189 119 199 127" fill="none" stroke="#583b64" stroke-width="4" stroke-linecap="round"/>
        <ellipse cx="160" cy="147" rx="7" ry="5" fill="#a84f7e"/>
       </g>
       <g id="surpriseFace" class="face" style="display:none">
        <ellipse cx="132" cy="128" rx="10" ry="14" fill="#583b64"/><ellipse cx="188" cy="128" rx="10" ry="14" fill="#583b64"/>
        <circle cx="135" cy="123" r="3.5" fill="white"/><circle cx="191" cy="123" r="3.5" fill="white"/>
        <ellipse cx="160" cy="149" rx="7" ry="10" fill="#9c4776"/>
       </g>
       <g id="sleepFace" class="face" style="display:none">
        <path d="M120 128 Q132 137 144 128 M176 128 Q188 137 200 128" fill="none" stroke="#583b64" stroke-width="4" stroke-linecap="round"/>
        <path d="M153 147 Q160 151 167 147" fill="none" stroke="#a84f7e" stroke-width="3" stroke-linecap="round"/>
        <path d="M220 92 l7 -12 l5 12 l12 3 l-12 5 l-5 12 l-5 -12 l-12 -5Z" fill="#fff2ad"/>
       </g>
       <circle cx="228" cy="100" r="5" fill="#fff" opacity=".65"/>
      </svg>
    </div>
  </section>
  <div class="reaction" id="reaction">さわってみてね…♡</div>
  <div class="actions">
   <button class="action active" data-action="poke"><span>☝️</span>ぷにっ</button>
   <button class="action" data-action="pat"><span>🫳</span>なでなで</button>
   <button class="action" data-action="tickle"><span>✨</span>こちょこちょ</button>
  </div>
  <div class="bottom"><button class="reset" id="reset">↻ はじめから</button></div>
</main>
<script>
const $=id=>document.getElementById(id);
let count=0,affection=0,mode='poke',soundOn=true,audioCtx=null;
const modes={poke:{name:'ぷにっ',cls:'squish',lines:['ぷにっ！','むにゅ〜♡','もちもちっ！','きゃっ！','ぷるん♪']},pat:{name:'なでなで',cls:'pat',lines:['なでなで、すき〜♡','ほわぁ…','いいきもち…','もっとなでて？','えへへ♡']},tickle:{name:'こちょこちょ',cls:'stretch',lines:['きゃははっ！','くすぐった〜い！','ぷるぷるっ！','やーん！♡','あははっ♪']}};
function face(which){['happyFace','shyFace','surpriseFace','sleepFace'].forEach(id=>$(id).style.display=id===which?'':'none')}
function beep(){
 if(!soundOn)return;
 try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=mode==='tickle'?720:mode==='pat'?480:590;g.gain.setValueAtTime(.055,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.11);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.12)}catch(e){}
}
function touch(e){
 count++;affection+=mode==='pat'?2:1;
 $('count').textContent=count;$('love').textContent='♡ '+affection;
 $('mood').textContent=count<3?'ふつう':count<7?'ごきげん':count<13?'でれでれ':'だいすき';
 const m=modes[mode];$('octo').classList.remove('squish','pat','stretch');void $('octo').getBoundingClientRect();$('octo').classList.add(m.cls);
 $('reaction').textContent=m.lines[Math.floor(Math.random()*m.lines.length)];
 if(mode==='tickle')face('surpriseFace');else if(mode==='pat')face(count%3===0?'sleepFace':'shyFace');else face(count%4===0?'surpriseFace':count>7?'shyFace':'happyFace');
 const r=$('scene').getBoundingClientRect(),x=e.clientX||r.left+r.width/2,y=e.clientY||r.top+r.height/2;
 const s=document.createElement('span');s.className='float-text';s.textContent=['♡','✦','ぷにっ','♪','✨'][Math.floor(Math.random()*5)];s.style.left=(x-r.left)+'px';s.style.top=(y-r.top)+'px';$('scene').appendChild(s);setTimeout(()=>s.remove(),850);
 if(navigator.vibrate)navigator.vibrate(mode==='tickle'?[15,25,15]:12);
 beep();
}
$('octoWrap').addEventListener('pointerdown',e=>{e.preventDefault();touch(e)});
document.querySelectorAll('.action').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.action;document.querySelectorAll('.action').forEach(x=>x.classList.toggle('active',x===b));$('reaction').textContent=modes[mode].name+'モードだよ！';}));
$('sound').addEventListener('click',()=>{soundOn=!soundOn;$('sound').textContent=soundOn?'♪':'♪̸';$('sound').setAttribute('aria-label',soundOn?'音オン':'音オフ')});
$('reset').addEventListener('click',()=>{count=0;affection=0;$('count').textContent='0';$('love').textContent='♡ 0';$('mood').textContent='ふつう';$('reaction').textContent='さわってみてね…♡';face('happyFace');});
for(let i=0;i<8;i++){let b=document.createElement('i');b.className='bubble';b.style.left=(4+Math.random()*92)+'%';b.style.width=b.style.height=(6+Math.random()*15)+'px';b.style.animationDuration=(8+Math.random()*9)+'s';b.style.animationDelay=(-Math.random()*12)+'s';$('scene').appendChild(b)}
</script>
</body></html>
